<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validador QR Móvil</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;text-align:center;padding:15px}
.container{max-width:600px;margin:auto;background:white;padding:20px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
button{padding:14px 18px;font-size:18px;margin:8px;border:none;border-radius:8px;background:#0078d4;color:white}
input{width:90%;padding:12px;font-size:18px;margin:8px;text-align:center}
#reader{width:100%;max-width:400px;margin:15px auto;display:none}
#resultado{margin-top:20px;padding:20px;font-size:28px;font-weight:bold;border-radius:10px}
.ok{background:#28a745;color:white}
.error{background:#dc3545;color:white}
</style>
</head>
<body>
<div class="container">
<h2>Validación de QR</h2>
<input id="qr1" placeholder="Código 1" readonly>
<input id="qr2" placeholder="Código 2" readonly><br>
<button onclick="leer(1)">Escanear Código 1</button>
<button onclick="leer(2)">Escanear Código 2</button>
<button onclick="reiniciar()">Nueva Validación</button>
<div id="reader"></div>
<div id="resultado"></div>
</div>
<script>
let html5QrCode=null;
let objetivo=1;
function leer(campo){
objetivo=campo;
document.getElementById('reader').style.display='block';
if(html5QrCode){html5QrCode.stop().catch(()=>{});}
html5QrCode=new Html5Qrcode('reader');
html5QrCode.start({facingMode:'environment'},{fps:10,qrbox:250},
(decodedText)=>{
if(objetivo===1){document.getElementById('qr1').value=decodedText;}
if(objetivo===2){document.getElementById('qr2').value=decodedText; validar();}
html5QrCode.stop();
document.getElementById('reader').style.display='none';
});
}
function validar(){
let a=document.getElementById('qr1').value.trim();
let b=document.getElementById('qr2').value.trim();
let r=document.getElementById('resultado');
if(a && b){
if(a===b){r.className='ok';r.innerHTML='✅ CÓDIGOS COINCIDEN';}
else{r.className='error';r.innerHTML='❌ CÓDIGOS DIFERENTES';}
}
}
function reiniciar(){
document.getElementById('qr1').value='';
document.getElementById('qr2').value='';
document.getElementById('resultado').innerHTML='';
document.getElementById('resultado').className='';
}
</script>
</body>
</html>
